<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A1 - Staff Logout</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #1e293b
                );

            padding: 20px;

        }

        .logout-box {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 14px;

            text-align: center;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);

        }

        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #dcfce7;

            color: #16a34a;

            font-size: 35px;

        }

        h1 {

            color: #0f172a;

            font-size: 24px;

            margin-bottom: 10px;

        }

        p {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;

        }

        .login-btn {

            display: inline-block;

            text-decoration: none;

            background: #2563eb;

            color: white;

            padding: 13px 25px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: bold;

        }

        .login-btn:hover {

            background: #1d4ed8;

        }

        .footer {

            margin-top: 25px;

            color: #94a3b8;

            font-size: 11px;

        }

    </style>

</head>

<body>

<div class="logout-box">

    <div class="icon">
        ✓
    </div>

    <h1>
        Logged Out Successfully
    </h1>

    <p>
        Your staff session has been securely cleared.
        Click the button below to login again.
    </p>

    <a
        href="staff-login.html"
        class="login-btn"
    >
        Staff Login
    </a>

    <div class="footer">
        A1 Car Detailing Factory
    </div>

</div>


<script>

    /* =====================================================
       CLEAR ALL STAFF SESSION DATA
    ===================================================== */

    function clearStaffSession() {

        sessionStorage.removeItem(
            "staffLoggedIn"
        );

        sessionStorage.removeItem(
            "a1StaffLoggedIn"
        );

        sessionStorage.removeItem(
            "staffData"
        );

        sessionStorage.removeItem(
            "a1StaffName"
        );

        sessionStorage.removeItem(
            "a1StaffUsername"
        );

        sessionStorage.removeItem(
            "a1StaffAddVehicle"
        );


        /*
         * Also remove any possible old staff keys.
         */

        sessionStorage.removeItem(
            "staffUsername"
        );

        sessionStorage.removeItem(
            "staffName"
        );

        sessionStorage.removeItem(
            "staffRole"
        );

    }


    /*
     * Clear session immediately
     */

    clearStaffSession();

</script>

</body>
</html>
